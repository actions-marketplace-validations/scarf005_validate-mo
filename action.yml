name: Validate gettext MO
description: Fail PRs whose .mo files are malformed or carry hidden bytes; warn when a .mo differs from its .po.
author: scarf005
branding: { icon: shield, color: green }
inputs:
  token: { description: Token used to list PR files, default: "${{ github.token }}" }
  pattern: { description: Regex every changed file must fully match, default: '(?:.*/)?lang/(?:.*/)?[^/]+\.(?:po|mo|pot)' }
runs:
  using: composite
  steps:
    - run: command -v msgfmt >/dev/null || { S=$(command -v sudo); $S apt-get update -qq && $S apt-get install -y -qq gettext; }
      shell: bash
    - run: python3 "$GITHUB_ACTION_PATH/validate_mo.py"
      shell: bash
      env: { GITHUB_TOKEN: "${{ inputs.token }}", PATTERN: "${{ inputs.pattern }}" }
