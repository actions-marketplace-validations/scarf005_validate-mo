on: { push: { branches: [main] }, pull_request: }
permissions: { contents: read, pull-requests: read }
jobs:
  test:
    strategy: { fail-fast: false, matrix: { os: [ubuntu-latest, ubuntu-slim] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: command -v msgfmt >/dev/null || { S=$(command -v sudo); $S apt-get update -qq && $S apt-get install -y -qq gettext; }
      - run: python3 -m unittest tests.test_validate_mo
  action:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: ./
